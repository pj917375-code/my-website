<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltex – Electronics Marketplace</title>
<style>
:root{--bg:#050a18;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#eef3ff;--mu:#8fa0c4;--ac:#2f7bff;--ac2:#00d4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(1200px 600px at 80% -10%,#0d2a6b55,transparent),var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
.w{max-width:1180px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#050a18d9;backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:14px;height:64px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
nav{display:flex;gap:16px;color:var(--mu);flex-wrap:wrap}nav a:hover,nav a.on{color:#fff}
.sp{flex:1}
input,select,textarea{background:#0b1430;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 13px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.sb{max-width:260px}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),#1450d6);transition:.2s;font-size:14px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #2f7bff55}
.btn.g{background:var(--card);border:1px solid var(--bd)}
.btn.sm{padding:6px 12px;font-size:13px}
.hero{padding:70px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(34px,5.5vw,58px);line-height:1.08;letter-spacing:-1.5px}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:16px 0 24px;font-size:17px}
.orb{aspect-ratio:1;border-radius:32px;background:linear-gradient(135deg,#2f7bff44,#00d4ff22);border:1px solid var(--bd);display:grid;place-items:center;font-size:130px;backdrop-filter:blur(10px);box-shadow:0 30px 80px #2f7bff33;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
h2{font-size:26px;margin:44px 0 18px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;backdrop-filter:blur(10px);transition:.25s;position:relative}
.card:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 14px 40px #2f7bff22}
.pic{aspect-ratio:1.2;border-radius:14px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#12307a,#0a1a45);margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.pr{font-weight:700;font-size:18px}.old{text-decoration:line-through;color:var(--mu);font-size:13px;margin-left:6px}
.tag{position:absolute;top:22px;left:22px;background:#e11d48;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.hb{position:absolute;top:20px;right:20px;background:#0008;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;color:#fff}
.cat{text-align:center;padding:18px 10px}.cat .pic{aspect-ratio:1.6;font-size:42px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.pd .pic{font-size:150px;aspect-ratio:1}
.f{display:grid;gap:12px;max-width:560px}.f label{font-size:13px;color:var(--mu)}
.lay{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:24px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.stat{font-size:28px;font-weight:800}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ac),var(--ac2));min-width:4px}
#toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#0f2a66;border:1px solid var(--ac);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.s{opacity:1}
footer{margin-top:70px;border-top:1px solid var(--bd);padding:30px 0;color:var(--mu)}
.wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#22c55e;border-radius:30px;padding:10px 16px;font-weight:600;z-index:40}
.ov{overflow-x:auto}
@media(max-width:800px){.hero,.pd,.lay{grid-template-columns:1fr}.orb{font-size:80px}.sb{max-width:none;flex:1 1 100%;order:5}}
</style></head><body>
<header><div class="w nav"><a class="logo" href="#home">⚡ VOLTEX</a>
<nav><a href="#home">Home</a><a href="#shop">Shop</a><a href="#categories">Categories</a><a href="#sell">Sell Products</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
<div class="sp"></div><input class="sb" id="q" list="sg" placeholder="Search electronics…" autocomplete="off"><datalist id="sg"></datalist>
<a href="#wishlist" title="Wishlist">♡<b id="wc"></b></a><a href="#cart" title="Cart">🛒<b id="cc"></b></a><span id="au"></span></div></header>
<main class="w" id="app"></main>
<footer><div class="w">© 2026 Voltex Marketplace · <a href="#privacy">Privacy Policy</a> · <a href="#terms">Terms &amp; Conditions</a> · Demo: all data is saved in your browser.</div></footer>
<a class="wa" href="https://wa.me/" target="_blank" rel="noopener">💬 WhatsApp Support</a>
<div id="toast"></div>
<script>
const CATS=[["Smartphones & Tablets","📱"],["Laptops & Computers","💻"],["Desktop Accessories","⌨️"],["TVs & Displays","📺"],["Cameras & Photography","📷"],["Audio & Headphones","🎧"],["Gaming Consoles","🎮"],["Smart Watches","⌚"],["Electronic Components","🔌"],["Chargers & Cables","🔋"],["Networking Equipment","📡"],["Electrical Materials","💡"]];
const P0=[["Nova X Pro 5G",0,"Nova",799,899,"New",4.8,"Flagship 6.7\" OLED, 256GB, 50MP camera."],["Slate Tab 11",0,"Slate",349,0,"Refurbished",4.4,"11\" tablet, 128GB, stylus support."],["AeroBook 14",1,"Aero",1199,1399,"New",4.9,"M-class chip, 16GB RAM, 512GB SSD."],["ProDesk Tower",1,"Forge",999,0,"Used",4.2,"Ryzen 7, RTX 3060, 32GB RAM."],["MechKey 75",2,"Keyz",89,119,"New",4.6,"Hot-swap mechanical keyboard."],["UltraView 27 4K",3,"Lumen",429,0,"New",4.7,"27\" 4K IPS, 144Hz, HDR."],["Lumen OLED 55",3,"Lumen",1099,1299,"New",4.8,"55\" OLED smart TV."],["Alpha Mirrorless",4,"Optix",1499,0,"New",4.9,"24MP full-frame mirrorless camera."],["ActionCam 5",4,"Optix",249,299,"Used",4.3,"4K waterproof action camera."],["SoundPods ANC",5,"Sonic",179,229,"New",4.7,"Noise-cancelling true wireless."],["StudioMax Headset",5,"Sonic",299,0,"New",4.6,"Over-ear hi-res wireless headphones."],["PlayBox Series",6,"Forge",449,499,"New",4.8,"Next-gen console, 1TB."],["Chrono Watch S3",7,"Nova",279,329,"New",4.5,"AMOLED smartwatch, GPS, health."],["Arduino Starter Kit",8,"Circuit",59,0,"New",4.7,"Boards, sensors, resistors, LEDs."],["GaN Charger 100W",9,"Volt",49,69,"New",4.8,"3-port fast charger + USB-C cable."],["WiFi 7 Router",10,"Netix",219,0,"New",4.5,"Tri-band mesh-ready router."]];
const DEF={products:P0.map((p,i)=>({id:i+1,n:p[0],c:p[1],b:p[2],p:p[3],o:p[4],cd:p[5],r:p[6],d:p[7],q:5+i%9,s:"Voltex Official",sold:20+(i*37)%90,approved:1})),cart:{},wish:[],user:null,users:[{n:"Admin",e:"admin@demo.com",pw:"admin123",role:"admin"}],orders:[],recent:[],cmp:[],next:100};
let S;try{S=JSON.parse(localStorage.getItem("vx"))||DEF}catch(e){S=DEF}
const save=()=>{try{localStorage.setItem("vx",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="s";clearTimeout(t.k);t.k=setTimeout(()=>t.className="",2200)};
const byId=id=>S.products.find(p=>p.id==id);
const live=()=>S.products.filter(p=>p.approved);
let F={q:"",cat:"",cond:"",brand:"",max:5000,sort:"pop"},coupon=0;
const em=p=>p.img||CATS[p.c][1];
function card(p){const dis=p.o?Math.round(100-p.p/p.o*100):0;
return `<div class="card"><a href="#product-${p.id}">${dis?`<span class="tag">-${dis}%</span>`:""}<div class="pic">${em(p)}</div><div class="mu">${esc(p.b)} · ${p.cd}</div><div><b>${esc(p.n)}</b></div><div class="mu">★ ${p.r} · ${p.q>0?p.q+" in stock":"Sold out"}</div><div><span class="pr">${money(p.p)}</span>${p.o?`<span class="old">${money(p.o)}</span>`:""}</div></a>
<button class="hb" onclick="wish(${p.id})">${S.wish.includes(p.id)?"❤️":"♡"}</button><div class="row" style="margin-top:10px"><button class="btn sm" onclick="add(${p.id})">Add to Cart</button><button class="btn sm g" onclick="cmp(${p.id})">Compare</button></div></div>`}
const sec=(t,l)=>`<h2>${t}</h2><div class="grid">${l.map(card).join("")}</div>`;
function add(id,go){const p=byId(id);if(!p||p.q<1)return toast("Out of stock");S.cart[id]=Math.min((S.cart[id]||0)+1,p.q);save();upd();toast("Added to cart");if(go)location.hash="checkout"}
function wish(id){const i=S.wish.indexOf(id);i<0?S.wish.push(id):S.wish.splice(i,1);save();upd();toast(i<0?"Saved to wishlist":"Removed from wishlist");route()}
function cmp(id){if(!S.cmp.includes(id))S.cmp=[...S.cmp.slice(-2),id];save();toast("Added to comparison");if(location.hash=="#compare")route()}
function qty(id,d){const p=byId(id);S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];else if(S.cart[id]>p.q)S.cart[id]=p.q;save();upd();route()}
function upd(){$("#cc").textContent=Object.values(S.cart).reduce((a,b)=>a+b,0)||"";$("#wc").textContent=S.wish.length||"";
$("#au").innerHTML=S.user?`<a class="btn sm g" href="#${S.user.role=="admin"?"admin":"dashboard"}">👤 ${esc(S.user.n)}</a> <button class="btn sm g" onclick="out()">Logout</button>`:`<a class="btn sm g" href="#login">Login</a> <a class="btn sm" href="#register">Register</a>`;
$("#sg").innerHTML=live().map(p=>`<option value="${esc(p.n)}">`).join("")}
function out(){S.user=null;save();upd();toast("Logged out");location.hash="home"}
function totals(){let sub=0;for(const id in S.cart){const p=byId(id);if(p)sub+=p.p*S.cart[id]}const disc=sub*coupon,del=sub>0&&sub-disc<500?15:0;return{sub,disc,del,tot:sub-disc+del}}
const pages={
home(){const l=live();return `<section class="hero"><div><h1>Discover. Buy. Sell. <span>Experience Technology.</span></h1><p>The trusted marketplace for new, refurbished and second-hand electronics, components and accessories.</p><div class="row"><a class="btn" href="#shop">Shop Now</a><a class="btn g" href="#sell">Start Selling</a></div></div><div class="orb">🎧</div></section>
<h2>Shop by Category</h2><div class="grid">${CATS.slice(0,6).map((c,i)=>`<a class="card cat" href="#shop" onclick="F.cat=${i}"><div class="pic">${c[1]}</div><b>${c[0]}</b></a>`).join("")}</div>
${sec("⭐ Featured Products",l.slice(0,4))}${sec("🔥 Trending Electronics",[...l].sort((a,b)=>b.r-a.r).slice(0,4))}${sec("🆕 New Arrivals",[...l].sort((a,b)=>b.id-a.id).slice(0,4))}${sec("🏆 Best Sellers",[...l].sort((a,b)=>b.sold-a.sold).slice(0,4))}${sec("💸 Special Offers",l.filter(p=>p.o).slice(0,4))}
${S.recent.length?sec("🕘 Recently Viewed",S.recent.map(byId).filter(Boolean)):""}
<h2>Trusted Brands</h2><div class="row mu" style="font-size:22px;font-weight:700;gap:34px">${[...new Set(P0.map(p=>p[2]))].join(" · ")}</div>
<h2>What Customers Say</h2><div class="grid">${[["Amina K.","Fast delivery and the refurbished laptop looks brand new!"],["David O.","Sold my old camera in two days. Seller dashboard is great."],["Grace M.","Best prices on components I've found anywhere."]].map(t=>`<div class="card">“${t[1]}”<div class="mu" style="margin-top:8px">— ${t[0]} ★★★★★</div></div>`).join("")}</div>
<div class="card" style="margin-top:40px;text-align:center"><h2 style="margin-top:0">Newsletter</h2><div class="row" style="justify-content:center"><input id="nl" type="email" placeholder="you@email.com" style="max-width:320px"><button class="btn" onclick="nl()">Subscribe</button></div></div>`},
categories(){return `<h2>All Categories</h2><div class="grid">${CATS.map((c,i)=>`<a class="card cat" href="#shop" onclick="F.cat=${i}"><div class="pic">${c[1]}</div><b>${c[0]}</b><div class="mu">${live().filter(p=>p.c==i).length} products</div></a>`).join("")}</div>`},
shop(){let l=live().filter(p=>(F.cat===""||p.c==F.cat)&&(!F.cond||p.cd==F.cond)&&(!F.brand||p.b==F.brand)&&p.p<=F.max&&(p.n+p.b+p.d).toLowerCase().includes(F.q.toLowerCase()));
l.sort((a,b)=>F.sort=="lo"?a.p-b.p:F.sort=="hi"?b.p-a.p:F.sort=="new"?b.id-a.id:b.sold-a.sold);
const brands=[...new Set(S.products.map(p=>p.b))];
return `<div class="lay"><aside class="card" style="height:fit-content;display:grid;gap:10px"><b>Filters</b><label class="mu">Category</label><select onchange="F.cat=this.value;route()"><option value="">All</option>${CATS.map((c,i)=>`<option value="${i}" ${F.cat==i&&F.cat!==""?"selected":""}>${c[0]}</option>`).join("")}</select>
<label class="mu">Brand</label><select onchange="F.brand=this.value;route()"><option value="">All</option>${brands.map(b=>`<option ${F.brand==b?"selected":""}>${esc(b)}</option>`).join("")}</select>
<label class="mu">Condition</label><select onchange="F.cond=this.value;route()"><option value="">Any</option>${["New","Used","Refurbished"].map(b=>`<option ${F.cond==b?"selected":""}>${b}</option>`).join("")}</select>
<label class="mu">Max price: ${money(F.max)}</label><input type="range" min="20" max="5000" step="10" value="${F.max}" onchange="F.max=+this.value;route()">
<label class="mu">Sort</label><select onchange="F.sort=this.value;route()">${[["pop","Popularity"],["lo","Price: low–high"],["hi","Price: high–low"],["new","Newest"]].map(o=>`<option value="${o[0]}" ${F.sort==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
<button class="btn g sm" onclick="F={q:'',cat:'',cond:'',brand:'',max:5000,sort:'pop'};$('#q').value='';route()">Reset</button><a class="btn g sm" href="#compare">Compare (${S.cmp.length})</a></aside>
<div><div class="mu">${l.length} result(s)${F.q?` for “${esc(F.q)}”`:""}</div>${l.length?`<div class="grid" style="margin-top:12px">${l.map(card).join("")}</div>`:`<div class="card" style="margin-top:12px">No products match your filters.</div>`}</div></div>`},
compare(){const l=S.cmp.map(byId).filter(Boolean);return `<h2>Compare Products</h2>${l.length?`<div class="card ov"><table><tr><th></th>${l.map(p=>`<th>${em(p)} ${esc(p.n)}</th>`).join("")}</tr>${[["Price",p=>money(p.p)],["Brand",p=>esc(p.b)],["Condition",p=>p.cd],["Rating",p=>"★ "+p.r],["Stock",p=>p.q],["Details",p=>esc(p.d)]].map(r=>`<tr><td>${r[0]}</td>${l.map(p=>`<td>${r[1](p)}</td>`).join("")}</tr>`).join("")}</table></div><button class="btn g sm" style="margin-top:12px" onclick="S.cmp=[];save();route()">Clear</button>`:`<div class="card">Nothing to compare yet. Use “Compare” on product cards.</div>`}`},
product(id){const p=byId(id);if(!p)return `<h2>Product not found</h2>`;S.recent=[p.id,...S.recent.filter(x=>x!=p.id)].slice(0,4);save();
const rv=(p.rev||[]);return `<div class="pd"><div class="pic">${em(p)}</div><div><div class="mu">${CATS[p.c][0]} · ${esc(p.b)} · ${p.cd}</div><h1 style="margin:6px 0">${esc(p.n)}</h1><div class="mu">★ ${p.r} (${rv.length+12} reviews) · Seller: ${esc(p.s)} ✔ verified</div><div style="margin:14px 0"><span class="pr" style="font-size:30px">${money(p.p)}</span>${p.o?`<span class="old">${money(p.o)}</span>`:""}</div><p>${esc(p.d)}</p><p class="mu" style="margin:10px 0">${p.q>0?"✅ "+p.q+" available":"❌ Out of stock"} · Free delivery over $500</p>
<div class="row"><button class="btn" onclick="add(${p.id})">Add to Cart</button><button class="btn g" onclick="add(${p.id},1)">Buy Now</button><button class="btn g" onclick="wish(${p.id})">${S.wish.includes(p.id)?"❤️ Wishlisted":"♡ Wishlist"}</button></div>
<h2 style="font-size:18px">Specifications</h2><table>${[["Brand",p.b],["Condition",p.cd],["Category",CATS[p.c][0]],["Warranty",p.cd=="New"?"12 months":"3 months"]].map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div></div>
<h2>Reviews</h2><div class="card">${rv.map(r=>`<p>★${r.s} <b>${esc(r.u)}</b>: ${esc(r.t)}</p>`).join("")||'<p class="mu">Be the first to review.</p>'}<div class="row" style="margin-top:10px"><select id="rs" style="width:80px">${[5,4,3,2,1].map(n=>`<option>${n}</option>`)}</select><input id="rt" placeholder="Write a review…" style="flex:1"><button class="btn sm" onclick="review(${p.id})">Post</button></div></div>${sec("Related Products",live().filter(x=>x.c==p.c&&x.id!=p.id).slice(0,4))}`},
cart(){const ids=Object.keys(S.cart).filter(byId),t=totals();if(!ids.length)return `<h2>Your cart is empty</h2><a class="btn" href="#shop">Start shopping</a>`;
return `<h2>Shopping Cart</h2><div class="card ov"><table>${ids.map(i=>{const p=byId(i);return `<tr><td>${em(p)} ${esc(p.n)}</td><td>${money(p.p)}</td><td><button class="btn sm g" onclick="qty(${i},-1)">−</button> ${S.cart[i]} <button class="btn sm g" onclick="qty(${i},1)">+</button></td><td>${money(p.p*S.cart[i])}</td><td><button class="btn sm g" onclick="S.cart[${i}]=0;qty(${i},0)">✕</button></td></tr>`}).join("")}</table></div>${sumbox(t)}<div class="row" style="margin-top:12px"><input id="cp" placeholder="Coupon (try VOLT10)" style="max-width:220px"><button class="btn g" onclick="cpn()">Apply</button><a class="btn" href="#checkout">Checkout</a></div>`},
checkout(){if(!S.user){toast("Please login to checkout");return pages.login()}const t=totals();if(!t.sub)return `<h2>Cart is empty</h2>`;
return `<h2>Checkout</h2><div class="pd"><div class="f"><label>Full name</label><input id="cn" value="${esc(S.user.n)}"><label>Phone</label><input id="cph"><label>Delivery address</label><textarea id="ca"></textarea><label>Payment method</label><select id="cm"><option>Mobile Money</option><option>Card</option><option>Cash on Delivery</option></select><button class="btn" onclick="place()">Place Order</button></div>${sumbox(t)}</div>`},
wishlist(){const l=S.wish.map(byId).filter(Boolean);return l.length?sec("My Wishlist",l):`<h2>Wishlist is empty</h2>`},
orders(){if(!S.user){return pages.login()}const l=S.orders.filter(o=>o.u==S.user.e);return `<h2>My Orders</h2>${l.length?`<div class="card ov"><table><tr><th>ID</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr>${l.map(o=>`<tr><td>#${o.id}</td><td>${o.d}</td><td>${o.items.map(i=>esc(i.n)+" ×"+i.q).join(", ")}</td><td>${money(o.t)}</td><td>${o.st}</td><td><button class="btn sm g" onclick="track(${o.id})">Track</button></td></tr>`).join("")}</table></div>`:`<div class="card">No orders yet.</div>`}`},
dashboard(){if(!S.user)return pages.login();const mine=S.products.filter(p=>p.s==S.user.n),mo=S.orders.flatMap(o=>o.items.filter(i=>mine.some(m=>m.id==i.id)).map(i=>({...i,oid:o.id,st:o.st})));
return `<h2>${S.user.role=="seller"?"Seller":"Customer"} Dashboard</h2><div class="grid"><div class="card"><div class="mu">My listings</div><div class="stat">${mine.length}</div></div><div class="card"><div class="mu">Units sold</div><div class="stat">${mo.reduce((a,i)=>a+i.q,0)}</div></div><div class="card"><div class="mu">Earnings</div><div class="stat">${money(mo.reduce((a,i)=>a+i.q*i.p,0))}</div></div><div class="card"><div class="mu">My orders</div><div class="stat">${S.orders.filter(o=>o.u==S.user.e).length}</div></div></div>
<div class="row" style="margin-top:14px"><a class="btn" href="#sell">+ New Listing</a><a class="btn g" href="#orders">My Orders</a></div><h2>My Listings</h2><div class="card ov"><table>${mine.map(p=>`<tr><td>${em(p)} ${esc(p.n)}</td><td>${money(p.p)}</td><td>Qty ${p.q}</td><td>${p.approved?"Live":"Pending approval"}</td><td><button class="btn sm g" onclick="edit(${p.id})">Edit price</button> <button class="btn sm g" onclick="del(${p.id})">Delete</button></td></tr>`).join("")||"<tr><td>No listings yet.</td></tr>"}</table></div>
<h2>Incoming Orders</h2><div class="card ov"><table>${mo.map(i=>`<tr><td>#${i.oid}</td><td>${esc(i.n)} ×${i.q}</td><td>${money(i.p*i.q)}</td><td>${i.st}</td></tr>`).join("")||"<tr><td>No orders yet.</td></tr>"}</table></div>`},
sell(){if(!S.user){toast("Login to sell");return pages.login()}return `<h2>Sell Your Electronics</h2><div class="f card"><label>Product name</label><input id="sn"><label>Category</label><select id="sc">${CATS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")}</select><label>Brand</label><input id="sbr"><label>Price (USD)</label><input id="sp" type="number" min="1"><label>Condition</label><select id="sd"><option>New</option><option>Used</option><option>Refurbished</option></select><label>Quantity</label><input id="sq" type="number" min="1" value="1"><label>Description & specifications</label><textarea id="sx" rows="4"></textarea><label>Contact phone</label><input id="sph"><label>Product image</label><input id="si" type="file" accept="image/*"><button class="btn" onclick="publish()">Publish Listing</button></div>`},
login(){return `<h2>Login</h2><div class="f card"><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><button class="btn" onclick="login()">Login</button><a class="mu" onclick="reset()">Forgot password?</a><div class="mu">Demo admin: admin@demo.com / admin123</div></div>`},
register(){return `<h2>Create Account</h2><div class="f card"><label>Name</label><input id="rn"><label>Email</label><input id="re" type="email"><label>Password (min 6)</label><input id="rp" type="password"><label>I want to</label><select id="rr"><option value="customer">Buy (Customer)</option><option value="seller">Buy & Sell (Seller)</option></select><button class="btn" onclick="reg()">Register</button></div>`},
admin(){if(!S.user||S.user.role!="admin"){toast("Admins only");return pages.login()}const rev=S.orders.reduce((a,o)=>a+o.t,0),bc=CATS.map((c,i)=>[c[0],S.orders.flatMap(o=>o.items).filter(x=>x.c==i).reduce((a,x)=>a+x.p*x.q,0)]),mx=Math.max(1,...bc.map(x=>x[1]));
return `<h2>Admin Dashboard</h2><div class="grid">${[["Users",S.users.length],["Products",S.products.length],["Orders",S.orders.length],["Revenue",money(rev)],["Pending",S.orders.filter(o=>o.st!="Delivered").length],["Completed",S.orders.filter(o=>o.st=="Delivered").length]].map(s=>`<div class="card"><div class="mu">${s[0]}</div><div class="stat">${s[1]}</div></div>`).join("")}</div>
<h2>Revenue by Category</h2><div class="card">${bc.filter(x=>x[1]).map(x=>`<div class="row"><span style="width:190px" class="mu">${x[0]}</span><div class="bar" style="width:${x[1]/mx*60}%"></div> ${money(x[1])}</div>`).join("")||'<span class="mu">No sales yet — place an order to see analytics.</span>'}</div>
<h2>Product Approval</h2><div class="card ov"><table>${S.products.filter(p=>!p.approved).map(p=>`<tr><td>${esc(p.n)}</td><td>${esc(p.s)}</td><td><button class="btn sm" onclick="byId(${p.id}).approved=1;save();route()">Approve</button> <button class="btn sm g" onclick="del(${p.id})">Reject</button></td></tr>`).join("")||"<tr><td>No pending products.</td></tr>"}</table></div>
<h2>Orders</h2><div class="card ov"><table>${S.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.u)}</td><td>${money(o.t)}</td><td>${o.pay}</td><td><select onchange="S.orders.find(x=>x.id==${o.id}).st=this.value;save();toast('Status updated')">${["Processing","Shipped","Delivered"].map(s=>`<option ${o.st==s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||"<tr><td>No orders yet.</td></tr>"}</table></div>
<h2>Users</h2><div class="card ov"><table>${S.users.map(u=>`<tr><td>${esc(u.n)}</td><td>${esc(u.e)}</td><td>${u.role}</td></tr>`).join("")}</table></div>`},
about(){return `<h2>About Voltex</h2><div class="card"><p>Voltex is a trusted marketplace where people buy, sell and exchange electronic devices, components and materials. Every seller is verified and every purchase is protected.</p></div>`},
contact(){return `<h2>Contact & Support</h2><div class="f card"><input id="mn" placeholder="Your name"><input id="me" type="email" placeholder="Email"><textarea id="mm" rows="4" placeholder="How can we help?"></textarea><button class="btn" onclick="msg()">Send Message</button><a class="btn g" href="https://wa.me/" target="_blank" rel="noopener">Chat on WhatsApp</a></div>`},
privacy(){return `<h2>Privacy Policy</h2><div class="card">We collect only the information needed to process orders. We never sell personal data. In this demo all data stays in your browser.</div>`},
terms(){return `<h2>Terms & Conditions</h2><div class="card">By using Voltex you agree to list only genuine items, honor completed sales, and follow local laws. Voltex may remove listings that violate these terms.</div>`}};
const sumbox=t=>`<div class="card" style="height:fit-content;margin-top:14px"><div class="row"><span class="mu">Subtotal</span><span class="sp"></span>${money(t.sub)}</div><div class="row"><span class="mu">Discount</span><span class="sp"></span>−${money(t.disc)}</div><div class="row"><span class="mu">Delivery</span><span class="sp"></span>${t.del?money(t.del):"Free"}</div><hr style="border-color:var(--bd);margin:8px 0"><div class="row"><b>Total</b><span class="sp"></span><b class="pr">${money(t.tot)}</b></div></div>`;
const nl=()=>{const v=$("#nl").value;/^\S+@\S+\.\S+$/.test(v)?(toast("Subscribed 🎉"),$("#nl").value=""):toast("Enter a valid email")};
const cpn=()=>{const c=$("#cp").value.trim().toUpperCase();if(c=="VOLT10"){coupon=.1;toast("10% coupon applied")}else{coupon=0;toast("Invalid coupon")}route()};
function review(id){const t=$("#rt").value.trim();if(!S.user)return toast("Login to review");if(!t)return toast("Write something first");const p=byId(id);(p.rev=p.rev||[]).push({u:S.user.n,s:+$("#rs").value,t});save();toast("Review posted");route()}
function place(){const n=$("#cn").value.trim(),ph=$("#cph").value.trim(),a=$("#ca").value.trim();if(!n||ph.length<7||a.length<5)return toast("Fill in valid delivery details");const t=totals(),items=Object.keys(S.cart).map(i=>{const p=byId(i);p.q-=S.cart[i];p.sold+=S.cart[i];return{id:p.id,n:p.n,p:p.p,q:S.cart[i],c:p.c}});const id=1000+S.orders.length+1;S.orders.push({id,u:S.user.e,items,t:t.tot,st:"Processing",pay:$("#cm").value,d:new Date().toLocaleDateString()});S.cart={};coupon=0;save();upd();toast("Order #"+id+" confirmed! 🎉");location.hash="orders"}
function track(id){const o=S.orders.find(x=>x.id==id),st=["Processing","Shipped","Delivered"];toast("Order #"+id+": "+st.map(s=>(st.indexOf(s)<=st.indexOf(o.st)?"✔ ":"○ ")+s).join(" → "))}
function login(){const u=S.users.find(x=>x.e==$("#le").value.trim().toLowerCase()&&x.pw==$("#lp").value);if(!u)return toast("Invalid email or password");S.user=u;save();upd();toast("Welcome back, "+u.n);location.hash=u.role=="admin"?"admin":"dashboard"}
function reg(){const n=$("#rn").value.trim(),e=$("#re").value.trim().toLowerCase(),pw=$("#rp").value;if(n.length<2||!/^\S+@\S+\.\S+$/.test(e)||pw.length<6)return toast("Enter valid name, email & 6+ char password");if(S.users.some(u=>u.e==e))return toast("Email already registered");const u={n,e,pw,role:$("#rr").value};S.users.push(u);S.user=u;save();upd();toast("Account created!");location.hash="dashboard"}
function reset(){const e=prompt("Enter your email");const u=S.users.find(x=>x.e==(e||"").toLowerCase());if(!u)return toast("Email not found");const p=prompt("New password (min 6)");if(p&&p.length>=6){u.pw=p;save();toast("Password updated")}}
function publish(){const n=$("#sn").value.trim(),p=+$("#sp").value,q=+$("#sq").value,d=$("#sx").value.trim();if(n.length<3||!(p>0)||!(q>0)||d.length<10||$("#sph").value.trim().length<7)return toast("Please complete all fields correctly");
const f=$("#si").files[0],fin=img=>{S.products.push({id:S.next++,n,c:+$("#sc").value,b:$("#sbr").value.trim()||"Generic",p,o:0,cd:$("#sd").value,r:4.5,d,q,s:S.user.n,sold:0,approved:0,img:img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:""});save();upd();toast("Listing submitted for approval");location.hash="dashboard"};
if(f&&f.size<400000){const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}else{if(f)toast("Image too large (max 400KB) – using icon");fin("")}}
function edit(id){const v=+prompt("New price");if(v>0){byId(id).p=v;save();route()}}
function del(id){if(!confirm("Delete this product?"))return;S.products=S.products.filter(p=>p.id!=id);delete S.cart[id];S.wish=S.wish.filter(x=>x!=id);save();upd();route()}
function msg(){const ok=$("#mn").value.trim()&&/^\S+@\S+\.\S+$/.test($("#me").value)&&$("#mm").value.trim().length>4;ok?(toast("Message sent. We'll reply soon!"),["#mn","#me","#mm"].forEach(s=>$(s).value="")):toast("Please fill all fields")}
function route(){const h=(location.hash||"#home").slice(1),m=h.match(/^product-(\d+)$/),k=m?"product":h;$("#app").innerHTML=(pages[k]||pages.home)(m?m[1]:0);document.title="Voltex – "+k;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+k));window.scrollTo(0,0)}
$("#q").addEventListener("input",e=>{F.q=e.target.value;if(location.hash!="#shop")location.hash="shop";else{const p=e.target.selectionStart;route()}});
addEventListener("hashchange",route);upd();route();
</script></body></html>
